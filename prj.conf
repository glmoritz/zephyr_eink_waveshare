CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_I2C_SHELL=n
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y

CONFIG_MFD=y
CONFIG_MFD_AXP2101=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP192_AXP2101=y
CONFIG_CHARGER=y
CONFIG_CHARGER_AXP2101=y
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_AXP2101=y
CONFIG_LED=y
CONFIG_LED_AXP192_AXP2101=y

# LVGL - 4-gray grayscale EPD — full-frame buffers in SPIRAM
CONFIG_LVGL=y
CONFIG_LV_Z_BITS_PER_PIXEL=8
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# ---- WiFi / Networking -------------------------------------------------------
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
# IPv6 SLAAC is fully automatic: NET_IPV6_ND, NET_IPV6_NBR_CACHE, NET_IPV6_DAD
# and NET_IPV6_IID_EUI_64 all default to y when NET_IPV6=y.
# The router sends an RA with a prefix → Zephyr builds a global address via EUI-64
# IID → DAD completes (~2 s) → NET_EVENT_IPV6_ADDR_ADD fires.
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IF_MAX_IPV6_COUNT=1
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=80
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_ZVFS_POLL_MAX=8

# DHCP server for AP captive portal
CONFIG_NET_DHCPV4_SERVER=y

# Flash + NVS for persistent WiFi credentials
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Phase B: the TLS session buffer in llss_client.c is placed in .rtc_noinit
# via __attribute__((section(".rtc_noinit"))).  No Kconfig reservation is
# needed — the ESP32-S3 RTC slow RAM (8 KB) is always available.

# Thread stacks — WiFi + portal need more room
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ---- LLSS HTTP client -------------------------------------------------------
CONFIG_HTTP_CLIENT=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# Enable both TLS 1.2 (cert handshake, ~3 s on ESP32-S3) and TLS 1.3
# (ECDHE ephemeral mode, session tickets for cross-sleep resumption).
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
# TLS 1.3 ephemeral (ECDHE) key exchange — required for Let's Encrypt servers
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
# Session tickets (TLS 1.3 only in Zephyr 4.3):
# Server sends a NewSessionTicket post-handshake; Zephyr's 1-slot in-memory
# cache stores it so that reconnects within the same boot use an abbreviated
# handshake (~150 ms).  The same ticket is serialised to RTC slow RAM in
# connect_tls_addr() for cross-sleep resumption (Phase B.2).
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y
CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT=1
# PSA crypto core — required by TLS 1.3 (HKDF key schedule, PSA_WANT_* symbols).
# MBEDTLS_PSA_CRYPTO_CLIENT is auto-enabled (default y) when this is set.
# USE_PSA_CRYPTO must be kept off: enabling it makes every TLS 1.2 cipher also
# require PSA_WANT_* symbols, breaking the existing ECDH_C/ECDSA_C/GCM_C setup.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_USE_PSA_CRYPTO=n
# TLS 1.3 key schedule uses PSA HKDF + SHA-256 regardless of USE_PSA_CRYPTO.
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_SHA_256=y
# PSA ECDH driver (psa_crypto_ecp.c) is pulled in by TLS 1.3 ephemeral mode;
# it needs PSA ECC key type + curve symbols so mbedtls_ecc_group_from/to_psa
# are compiled (they are gated on PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY).
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=102400
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
# TLS record buffer — must fit the full server certificate chain during handshake
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# SNI — required for proper wildcard SAN hostname verification
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
# ECC support — required for ECDSA cert chain (Let's Encrypt E8 / ISRG Root X2)
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
# SHA-384 is required to parse ISRG Root X2 (ecdsa-with-SHA384 signature)
# SHA-512 must also be enabled as SHA-384 depends on it in mbedTLS
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_JSON_LIBRARY=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_NUM_CONCUR_QUERIES=3
# Built-in DHCPv4 option 6 -> DNS resolver integration
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
# Single interface — safe to clean up stale entries on reconfigure
CONFIG_DNS_RECONFIGURE_CLEANUP=y

# RTC (PCF85063ATL) + NTP time sync
CONFIG_RTC=y
CONFIG_SNTP=y

# ---- LLSS credential storage ------------------------------------------------
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Input subsystem --------------------------------------------------------
CONFIG_INPUT=y
CONFIG_GPIO_MCP230XX=y

# ---- LLSS display format ----------------------------------------------------
# bit_depth=2: server returns 4-level grayscale PNG (L8 quantised to 0/85/170/255)
# Frame buffer sized for compressed grayscale PNG (~3-20 KB typical, 65 KB ceiling)
CONFIG_LLSS_DISPLAY_BIT_DEPTH=2
CONFIG_LLSS_FRAME_BUF_SIZE=65536

# ---- LVGL lodepng PNG decoder -----------------------------------------------
CONFIG_LV_USE_LODEPNG=y

# ---- Zephyr shell (USB CDC-ACM, same /dev/ttyACM0 as console) ---------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_KERNEL_SHELL=y