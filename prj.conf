CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
# Interrupt-driven SPI completion. Without this the esp32 SPI driver polls:
# transceive() spins in `while (!spi_hal_usr_is_done(hal)) {}` with no yield, so
# writing the two 48 KB panel planes burned ~192 ms of CPU at the display
# thread's priority (12) and starved everything below it — device_ui (14) and
# the shell — for the whole transfer. DMA was already in use; this only moves
# completion to an ISR + semaphore so the thread sleeps instead of spinning.
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_LOG=y
CONFIG_SENSOR=y
CONFIG_SHTCX=y
CONFIG_I2C_SHELL=n
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y

CONFIG_MFD=y
CONFIG_MFD_AXP2101=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP192_AXP2101=y
CONFIG_CHARGER=y
CONFIG_CHARGER_AXP2101=y
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_AXP2101=y
CONFIG_LED=y
CONFIG_LED_AXP192_AXP2101=y

# LVGL - 4-gray grayscale EPD — full-frame buffers in SPIRAM
CONFIG_LVGL=y
# Native 1bpp. The panel is 1bpp, server frames arrive 1bpp, and the driver's
# planes are 1bpp — rendering at 8 or 16 bpp only bought a 1bpp->Nbpp->1bpp
# round trip that cost ~230 ms/frame. At depth 1 LVGL's draw buffer IS the panel
# format, so the whole conversion disappears (see llss_lvgl_flush_cb).
# Consequence: no anti-aliased text and no grays on device-UI screens. The
# dither/GRAY2/GRAY_MARK code stays in the driver but is dormant — revive by
# setting CONFIG_LV_COLOR_DEPTH_8 here and advertising PIXEL_FORMAT_L_8 in
# custom_ssd16xx_get_capabilities().
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_FMT_TXT_LARGE=y
CONFIG_LV_USE_FONT_COMPRESSED=y
CONFIG_REBOOT=y

# ---- WiFi / Networking -------------------------------------------------------
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
# NOTE on MTU/MSS: TCP MSS follows the *runtime* interface MTU
# (net_tcp_get_supported_mss -> net_if_get_mtu), so on the real device the link
# MTU set by DHCPv4 (IPv4) / IPv6 Router Advertisement (auto-applied in
# ipv6_nbr.c) governs it — do NOT hardcode CONFIG_NET_IPV4_MTU here or we'd
# stop respecting the network's advertised MTU (e.g. 1440 on the home LAN).
# The sim has no DHCP, so its MTU is pinned in boards/native_sim_64.conf.
# (Zephyr's CONFIG_NET_IPV4_MTU default is 576 = the slow-frame-fetch culprit
# when nothing raises the live iface MTU; verify DHCPv4 actually sets it.)
# IPv6 SLAAC is fully automatic: NET_IPV6_ND, NET_IPV6_NBR_CACHE, NET_IPV6_DAD
# and NET_IPV6_IID_EUI_64 all default to y when NET_IPV6=y.
# The router sends an RA with a prefix → Zephyr builds a global address via EUI-64
# IID → DAD completes (~2 s) → NET_EVENT_IPV6_ADDR_ADD fires.
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVBUF=y
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IF_MAX_IPV6_COUNT=1
# LLSS frame fetches are latency-sensitive and benefit from larger network
# fragments than Zephyr's conservative 128-byte default. A bigger RX pool lets
# the socket-backed receive window absorb larger bursts without stalling.
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_ZVFS_POLL_MAX=8

# DHCP server for AP captive portal
CONFIG_NET_DHCPV4_SERVER=y

# Flash + NVS for persistent WiFi credentials
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Phase B: the TLS session buffer in llss_client.c is placed in .rtc_noinit
# via __attribute__((section(".rtc_noinit"))).  No Kconfig reservation is
# needed — the ESP32-S3 RTC slow RAM (8 KB) is always available.

# Thread stacks — WiFi + portal need more room
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ---- LLSS HTTP client -------------------------------------------------------
CONFIG_HTTP_CLIENT=y
CONFIG_NET_HTTP_LOG_LEVEL_INF=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# Enable both TLS 1.2 (cert handshake, ~3 s on ESP32-S3) and TLS 1.3
# (ECDHE ephemeral mode, session tickets for cross-sleep resumption).
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# === TLS 1.3 KILL SWITCH (2026-05-19) ================================
# TLS 1.3 NewSessionTicket is sent AFTER the handshake; Zephyr does
# not currently catch it and feed it into the persistent session
# cache, so cross-boot resume silently fails under 1.3.
# Pinned to TLS 1.2 here: tickets ride inside the 1.2 handshake and
# CONFIG_NET_SOCKETS_TLS_SESSION_CACHE_PERSISTENT picks them up.
#
# IMPORTANT: the three CIPHERSUITE_TLS1_3_* lines below each do
# `select MBEDTLS_SSL_PROTO_TLS1_3` in Zephyr's mbedTLS Kconfig
# (modules/mbedtls/Kconfig.ciphersuites). They force the parent ON
# even when we set it =n here, so they must also be disabled.
# The two KEY_EXCHANGE_MODE_* lines live inside `if TLS1_3` and are
# Kconfig-invisible while TLS1_3 is off; commented to silence warnings.
#
# To re-enable TLS 1.3: flip TLS1_3=n to =y AND uncomment all five
# CONFIG_TLS_1_3 lines below.
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=n
# CONFIG_TLS_1_3 CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
# CONFIG_TLS_1_3 CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_PSK_EPHEMERAL_ENABLED=y
# =====================================================================
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PKCS5_C=y
# Session tickets: server emits a NewSessionTicket post-handshake; Zephyr's
# 1-slot in-memory cache stores it so reconnects within the same boot use the
# abbreviated handshake (~100-150 ms).
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y
CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT=1
# Persist the TLS session cache across reboots / deep sleep via the Settings
# subsystem on NVS.  First boot does a full handshake; every subsequent boot
# (cold or deep-sleep wake) restores the ticket and resumes in ~100-200 ms.
# Requires CONFIG_SETTINGS=y + CONFIG_SETTINGS_NVS=y (already set below).
# Added on Zephyr main in 2026-04 (commit 93eb99a2); Dockerfile pins past that.
CONFIG_NET_SOCKETS_TLS_SESSION_CACHE_PERSISTENT=y
CONFIG_NET_SOCKETS_TLS_SESSION_CACHE_PERSISTENT_PREFIX="tls/sess"
# PSA crypto core — required by TLS 1.3 (HKDF key schedule, PSA_WANT_* symbols).
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# TLS 1.3 key schedule and the enabled TLS 1.2 suites are driven by PSA_WANT_*
# selections in Zephyr 4.4.
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_SHA_512=y
# PSA ECDH/ECDSA support is pulled in by the selected TLS 1.2/1.3 suites.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
# TLS 1.3 ciphersuites — see TLS 1.3 KILL SWITCH above.
# These `select MBEDTLS_SSL_PROTO_TLS1_3`, so they MUST stay disabled
# while the kill switch is active. To re-enable TLS 1.3: uncomment.
# CONFIG_TLS_1_3 CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
# CONFIG_TLS_1_3 CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_256_GCM_SHA384=y
# CONFIG_TLS_1_3 CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_CHACHA20_POLY1305_SHA256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=102400
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
# TLS record buffer — must fit the full server certificate chain during handshake
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# TLS 1.2 ciphersuites for Let's Encrypt ECDSA P-256/P-384 leaf certs.
# These each `select`: MBEDTLS_SSL_PROTO_TLS1_2, MBEDTLS_X509_CRT_PARSE_C,
# MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED, and the PSA_WANT_* algos.
# When TLS 1.3 was enabled, X509_CRT_PARSE_C and friends came in via 1.3's
# selects; with 1.3 off (kill switch above) we must enable a TLS 1.2 suite
# explicitly or mbedtls_check_config.h rejects the build.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
# KEY_EXCHANGE_ECDHE_ECDSA_ENABLED is now selected by the ciphersuites above;
# the manual =y here used to silently drop to n because its X509_CRT_PARSE_C
# dependency was unmet. Kept commented as documentation.
# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_JSON_LIBRARY=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_NUM_CONCUR_QUERIES=3
# Built-in DHCPv4 option 6 -> DNS resolver integration
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
# Single interface — safe to clean up stale entries on reconfigure
CONFIG_DNS_RECONFIGURE_CLEANUP=y

# RTC (PCF85063ATL) + NTP time sync
CONFIG_RTC=y
CONFIG_SNTP=y

# ---- LLSS credential storage ------------------------------------------------
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Input subsystem --------------------------------------------------------
CONFIG_INPUT=y
CONFIG_GPIO_MCP230XX=y
# Input events (button up/down) must be processed promptly — the press-vs-
# long-press state machine (llss_thread.c) depends on the release being handled
# within LONG_PRESS_MS. The input thread defaults to the LOWEST app priority
# (K_LOWEST_APPLICATION_THREAD_PRIO = 14), BELOW the display thread (12); waking
# the display thread for press feedback would then preempt the input thread and
# starve the release past the long-press timeout, turning every tap into a
# LONG_PRESS. Put the input thread just above the display renderer (still below
# the LLSS/network thread at 10) so releases are never starved by rendering.
CONFIG_INPUT_MODE_THREAD=y
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=11

# ---- LLSS display format ----------------------------------------------------
# bit_depth=1: server returns the panel-native 1bpp packed framebuffer via
# ?raw=true (48000 B, MSB-first, Floyd-Steinberg dithered). The device blits it
# straight to panel RAM with no PNG/LVGL decode. Partial-refresh capable.
# Frame buffer holds the 48000 B packed frame (65 KB ceiling, ample headroom).
CONFIG_LLSS_DISPLAY_BIT_DEPTH=1
CONFIG_LLSS_FRAME_BUF_SIZE=65536

# Deterministic frame pattern self-test (debug tool, normally OFF). Set =y to
# request ?raw=true&pattern=1 and verify bytes at CP1 (fetch) / CP2 (render) +
# slot canaries. Found the recv_buf/ctx.buf aliasing bug on 2026-06-09.
# CONFIG_LLSS_PATTERN_TEST=y

# ---- LVGL lodepng PNG decoder -----------------------------------------------
CONFIG_LV_USE_LODEPNG=y

# ---- Zephyr shell (USB CDC-ACM, same /dev/ttyACM0 as console) ---------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_KERNEL_SHELL=y
# Telnet shell backend: same shell reachable over the network (TCP port 23) once
# WiFi is up, in parallel with the USB-CDC serial backend. Lets us drive `net
# iface`, `net allocs`, etc. without a USB cable on the deployed device.
CONFIG_SHELL_BACKEND_TELNET=y