#
# radvd configuration for the native_sim TAP interface.
#
# Emits Router Advertisements on zeth so the simulator picks up a SLAAC
# IPv6 address from fd00:dead::/64 — same code path the ESP32 build uses
# at home when its WiFi router emits RAs (NET_IPV6_ND + EUI-64 IID + DAD).
#

interface zeth
{
	AdvSendAdvert on;
	MinRtrAdvInterval 3;
	MaxRtrAdvInterval 10;
	AdvDefaultLifetime 300;

	prefix fd00:dead::/64
	{
		AdvOnLink on;
		AdvAutonomous on;
		AdvRouterAddr on;
	};

	# No RDNSS — DNS is handled via the IPv4 resolver configured in
	# boards/native_sim_64.conf (the LAN's resolver, which the local
	# network firewall allows). It returns AAAA records just fine; the
	# resolver's own address family is independent of the records it
	# serves.
};
