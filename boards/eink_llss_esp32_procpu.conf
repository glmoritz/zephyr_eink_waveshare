# ESP32-S3 specific WiFi config for eink_llss_esp32 board

CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_WIFI_NM=y

# Use SPIRAM heap for WiFi — frees ~40 KB DRAM (DRAM was at 93%+)
CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# N16R8: Enable 8MB OPI PSRAM
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Place WiFi + net stack noinit data in SPIRAM (libsubsys__net__ip.a etc.)
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# SPIRAM heap: runtime allocations (WiFi internals, k_malloc, etc.)
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304

# MbedTLS 100 KB heap → SPIRAM via .mbedtls_heap section (ESP32-S3 default.ld
# already has KEEP(*(.mbedtls_heap*)) inside .ext_ram.data / PSRAM region).
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# DRAM heap: kernel-internal allocs only — 32 KB is sufficient
# (Zephyr auto-bumps this to its computed minimum ~45 KB; value documents intent)
CONFIG_HEAP_MEM_POOL_SIZE=32768

# MCP23017 GPIO expander (I2C-based)
CONFIG_GPIO_MCP230XX=y

# Enable Zephyr crypto subsystem so the ESP32 hardware AES accelerator
# (espressif,esp32-aes, already status=okay in the SoC DTSI) is compiled in.
# CRYPTO_ESP32 and CRYPTO_ESP32_AES both select themselves via default=y
# when DT_HAS_ESPRESSIF_ESP32_AES_ENABLED is set.
CONFIG_CRYPTO=y
CONFIG_CRYPTO_ESP32_AES=y
# SHA hardware not needed here; disable to recover ~700 bytes DRAM BSS
CONFIG_CRYPTO_ESP32_SHA=n
# TLS can have two concurrent fetches — 2 AES sessions
CONFIG_ESP32_CRYPTO_AES_SESSIONS_MAX=2

