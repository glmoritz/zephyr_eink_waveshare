# Kconfig overlay for the native_sim board variant.
#
# Strips ESP32-only hardware (PMIC, charger, fuel gauge, MCP230XX, SSD16xx,
# WiFi) and substitutes host-side equivalents: SDL display, native TAP
# ethernet, in-tree flash simulator. Application code (LVGL, mbedTLS, TLS
# stack, LLSS client, NVS settings) is shared with the ESP32 build.

# ---- Drop ESP32-only peripherals -------------------------------------------
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_MIPI_DBI=n
CONFIG_MFD=n
CONFIG_MFD_AXP2101=n
CONFIG_REGULATOR=n
CONFIG_REGULATOR_AXP192_AXP2101=n
CONFIG_CHARGER=n
CONFIG_CHARGER_AXP2101=n
CONFIG_FUEL_GAUGE=n
CONFIG_FUEL_GAUGE_AXP2101=n
CONFIG_LED=n
CONFIG_LED_AXP192_AXP2101=n
CONFIG_GPIO_MCP230XX=n
CONFIG_INPUT=n

# ---- Display: SDL host window in 8-bpp greyscale ---------------------------
CONFIG_SDL_DISPLAY=y
# LVGL custom-section placement assumes Espressif PSRAM linker fragments;
# fall back to plain BSS on the host.
CONFIG_LV_Z_VDB_CUSTOM_SECTION=n
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=n

# ---- Networking: TAP instead of WiFi ---------------------------------------
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_DHCPV4_SERVER=n
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=n
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=n
CONFIG_ETH_NATIVE_TAP=y
# Static IP — host-side setup script assigns 192.0.2.0/24 with .2 as the
# gateway and the simulator taking .1.
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
# Match the LAN resolver Docker's daemon.json hands every container on this
# host. The network forbids egress to public DNS (1.1.1.1, 8.8.8.8), so the
# sim has to use the same in-LAN resolver. IPv4 DNS resolves AAAA records
# perfectly well — the v6-only LLSS server hostname comes back unchanged,
# so no separate IPv6 resolver is needed.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="192.168.213.1"

# ---- Storage: file-backed flash simulator ----------------------------------
# Backing file is selected at runtime via --flash=<path> on the command line.
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---- RTC: software emulator (no PCF85063A on host) -------------------------
CONFIG_RTC_EMUL=y

# ---- Debug build by default ------------------------------------------------
# The sim exists for debugging — mirror the profile from debug.conf so
# source-level stepping works out of the box. DEBUG_OPTIMIZATIONS expands
# to -Og (gcc's recommended debug mode); -O0 / CONFIG_NO_OPTIMIZATIONS is
# slightly more transparent but trips on some Zephyr inlined helpers.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_FRAME_POINTER=y

# ---- libc: picolibc matches the ESP32 build's surface ----------------------
# Host glibc requires _GNU_SOURCE for strnlen / gmtime_r; picolibc exposes
# them unconditionally and aligns sim ↔ device behaviour.
CONFIG_PICOLIBC=y

# ---- Posix bits ------------------------------------------------------------
# Native_sim provides a virtual UART that maps to stdio; console + shell work
# unchanged.
CONFIG_POSIX_API=y
