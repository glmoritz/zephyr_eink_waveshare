# Debug profile for source-level stepping
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y
# NOTE: do NOT use CONFIG_DEBUG_OPTIMIZATIONS (-Og) on this target. The Espressif
# xtensa GCC miscompiles http_parser.c at -Og: in header_states() the
#   enum header_states h_state = *header_state;   (parser.c ~line 529)
# deref yields garbage, so the Content-Length value parser only registers the
# FIRST digit (e.g. "182" -> 1, "70" -> 7). The body then "completes" after 1
# byte, the next byte trips HPE_INVALID_CONSTANT (err 30) -> http_client_req
# -EBADMSG (-77), and device registration (and every Content-Length response)
# silently fails. -Os and -O0 are unaffected. Pin -Os here.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_FRAME_POINTER=y

# Network/TLS debug logs on UART shell
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
CONFIG_MBEDTLS_DEBUG=n
CONFIG_MBEDTLS_LOG_LEVEL_DBG=n
CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=n
CONFIG_LOG_DEFAULT_LEVEL=3
