# Debug profile for source-level stepping
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y
# NOTE: do NOT use CONFIG_DEBUG_OPTIMIZATIONS (-Og) on this target. The Espressif
# xtensa GCC miscompiles http_parser.c at -Og: in header_states() the
#   enum header_states h_state = *header_state;   (parser.c ~line 529)
# deref yields garbage, so the Content-Length value parser only registers the
# FIRST digit (e.g. "182" -> 1, "70" -> 7). The body then "completes" after 1
# byte, the next byte trips HPE_INVALID_CONSTANT (err 30) -> http_client_req
# -EBADMSG (-77), and device registration (and every Content-Length response)
# silently fails. -Os and -O0 are unaffected. Pin -Os here.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_FRAME_POINTER=y

# Network/TLS debug logs on UART shell
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_INF=y
CONFIG_MBEDTLS_DEBUG=n
CONFIG_MBEDTLS_LOG_LEVEL_DBG=n
CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=n
CONFIG_LOG_DEFAULT_LEVEL=3
# Keep DEFERRED logging (the default). Do NOT use CONFIG_LOG_MODE_IMMEDIATE on
# this target: immediate mode formats each line on the caller's stack and emits
# synchronously, which overflows the small WiFi/net callback stacks and killed
# the device during association (observed 2026-06-18). Instead, prevent the
# "--- N messages dropped ---" overflow with a larger deferred buffer. The big
# offender (per-packet net_pkt DBG) is already disabled above, and the ESP32
# panic backtrace is printed directly by the fatal handler, not via this buffer.
CONFIG_LOG_BUFFER_SIZE=8192

# ---- Net-buffer / heap leak hunt (project_esp32_netbuf_crash) ----------------
# Enable on-demand `diag netmem` telemetry: net_pkt RX/TX slab free, net_buf
# RX/TX pool avail/max, and the Zephyr system (k_malloc) heap free/alloc/max.
# Use it when you want a snapshot without periodic console noise.
CONFIG_LLSS_NETMEM_DEBUG=y
# Required for the net_buf pool avail/max counters the telemetry reads.
CONFIG_NET_BUF_POOL_USAGE=y
# Required for the system-heap free/alloc/max columns (sys_heap_runtime_stats_get).
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# net_pkt allocation accounting. NOTE: do NOT enable NET_PKT_LOG_LEVEL_DBG — it
# emits a per-packet "net_pkt_print" line (~10+/s) that floods a multi-hour
# capture and perturbs timing. The alloc-failure lines we care about
# ("esp32_wifi: Failed to allocate net buffer", net-core buffer warnings) are
# LOG_ERR/WRN and show at the default level anyway.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
# Per-allocation caller tracking so `net allocs` reports the func():line that
# allocated each net_pkt/net_buf still in use — used to pinpoint the recovery-
# path leak (~1-2 buffers per sustained outage, not reclaimed). After an outage,
# the leaked ones show as "used" with a DNS/socket alloc caller and no free.
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
# Lifetime trace for the two leaking net_pkt populations (NS TX + small RX where
# the TLS close_notify lives). Emits greppable "PKTL" printk lines at alloc, the
# NS send-ok/drop path, and the terminal free (with alloc+free caller). A leaked
# pkt = alloc with no matching free; healthy ones reveal the normal free site.
# Disabled for the TX-drain hunt: the PKTL flood only traces NS/RX<128 and drops
# console lines, which garbles `net allocs` / NETMEM output. net_pkt accounting
# (CONFIG_NET_DEBUG_NET_PKT_ALLOC above) stays on so `net allocs` still names the
# leaked TX packets' caller + refcount.
CONFIG_LLSS_PKT_LIFETIME=n
# System liveness watchdog in DRY-RUN: supervisor thread + per-thread idle/alive
# beats, logs "WATCHDOG: would reset now — '<thread>' starved" on a hang but does
# NOT reset and does NOT arm the hardware WDT, so panics still halt for capture.
# (Kconfig default is off; this enables observation during debugging. Arm real
# HW-backed resets for production with CONFIG_LLSS_HW_WATCHDOG_DRY_RUN=n.)
CONFIG_LLSS_HW_WATCHDOG=y

# Per-thread stack high-water marks via Zephyr's standard shell command,
# with periodic auto-prints disabled.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_RUNTIME_STATS=y
